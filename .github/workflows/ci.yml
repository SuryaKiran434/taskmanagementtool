name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Every job in this workflow only reads the
# repository -- checkout, dependency install, lint/test and artifact upload all
# work fine with `contents: read`. A job that ever needs to write (push a commit,
# comment on a PR, cut a release) must request that scope on itself rather than
# widening this block.
permissions:
  contents: read

jobs:
  test:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # SonarCloud needs the full history to attribute code to authors and to
          # work out what counts as "new code"; a shallow clone breaks both.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Tests run against in-memory H2, so no service container is needed.
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      # JaCoCo writes the report during the `test` phase above, so there is no
      # extra Maven invocation here. Groundwork for SonarCloud, which reads the
      # same jacoco.xml.
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib, sys
          f = pathlib.Path("target/site/jacoco/jacoco.xml")
          if not f.exists():
              print("### Coverage\n\n_No JaCoCo report was produced._")
              sys.exit(0)
          root = ET.parse(f).getroot()
          rows = {}
          for c in root.findall("counter"):
              missed, covered = int(c.get("missed")), int(c.get("covered"))
              total = missed + covered
              rows[c.get("type")] = (covered, total, 100.0 * covered / total if total else 0.0)
          print("### Coverage (JaCoCo)")
          print()
          line = rows.get("LINE")
          if line:
              print(f"**{line[2]:.1f}% of lines** ({line[0]}/{line[1]})")
              print()
          print("| Metric | Covered | Total | % |")
          print("| --- | ---: | ---: | ---: |")
          for k in ("INSTRUCTION", "BRANCH", "LINE", "METHOD", "CLASS"):
              if k in rows:
                  covered, total, pct = rows[k]
                  print(f"| {k.title()} | {covered} | {total} | {pct:.1f}% |")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-coverage
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

      # Runs after the tests so target/site/jacoco/jacoco.xml already exists.
      # sonar-maven-plugin is used instead of the generic scan action because it
      # reads the compiled classes and the full dependency classpath straight out
      # of the Maven model -- the Java analyser needs that semantic information,
      # and the CLI scanner would need sonar.java.binaries/sonar.java.libraries
      # hand-maintained to get the same result. Configuration lives in pom.xml.
      #
      # Analysis is advisory here, not a gate: continue-on-error keeps a
      # SonarCloud outage or a scanner hiccup from failing the required check.
      - name: SonarCloud analysis
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B --no-transfer-progress sonar:sonar
