spring:
  profiles:
    active: dev
  data:
    web:
      pageable:
        max-page-size: 50
server:
    port: 8080
jwt:
    secret: ${JWT_SECRET}
app:
  password-reset:
    # Whether POST /api/users/forgot-password returns the OTP it generated.
    #
    # Off here, and off for every profile that does not say otherwise. That
    # endpoint is permitAll, and so is /reset-password, so an OTP in the
    # response body lets anyone who can name an address take over that account
    # without ever authenticating. Only the dev profile below turns it on.
    #
    # Turning this on in a deployed environment is an account-takeover switch,
    # not a debug convenience.
    expose-otp: false
---
spring:
  config:
    activate:
      on-profile: dev
server:
    port: 8081
jwt:
  secret: ${JWT_SECRET}
app:
  password-reset:
    # Local development only. There is no mailer yet, so without this the reset
    # flow cannot be completed by hand. See the note on the default above.
    expose-otp: true
---
spring:
  config:
    activate:
      on-profile: prod
server:
    port: 8082
jwt:
  secret: ${JWT_SECRET}